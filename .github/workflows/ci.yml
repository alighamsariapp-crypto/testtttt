name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-build-and-test:
    name: Node 22 - Lint, Build, Contract Tests & Release Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clean checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Reproducible dependency install with frozen lockfile & approved build scripts
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck / lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

      - name: Run production release gate checklist
        run: pnpm exec tsx scripts/production_release_checklist.ts .env.ci

      - name: Run targeted architecture boundary acceptance tests
        run: pnpm exec tsx tests/scripts/production_architecture_test.ts

      - name: Run targeted rate limiting acceptance tests
        run: pnpm exec tsx tests/scripts/rate_limiting_acceptance_test.ts

      - name: Run rate limiter concurrency stress test
        run: pnpm exec tsx tests/scripts/rate_limiter_concurrency_stress_test.ts

      - name: Run payment simulation security acceptance tests
        run: pnpm exec tsx tests/scripts/payment_simulation_security_test.ts

      - name: Run payment webhook concurrency and idempotency tests (20 concurrent requests)
        run: pnpm exec tsx tests/scripts/payment_webhook_concurrency_test.ts

      - name: Run targeted admin image upload security acceptance tests
        run: pnpm exec tsx tests/scripts/admin_image_upload_security_test.ts

      - name: Run full production data integrity acceptance test
        run: pnpm exec tsx tests/scripts/full_production_data_integrity_acceptance_test.ts

      - name: Run targeted browser/API contract tests
        run: |
          node tests/scripts/admin_content_management_contract_test.mjs
          node tests/scripts/admin_blog_management_contract_test.mjs
          node tests/scripts/cart_image_and_summary_cta_contract_test.mjs

      - name: Run production configuration smoke test
        run: pnpm exec tsx tests/scripts/production_smoke_test.ts

      - name: Publish Node & Contract Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-artifacts
          path: |
            dist/
            .test-output/
          if-no-files-found: ignore

  laravel-php-tests:
    name: PHP 8.3 - MySQL 8 Documented Production Engine & Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Production database engine: MySQL 8.0 (documented standard, MariaDB 10.6+ compatible)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: apexstore_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Clean checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3 with required extensions (GD, PDO MySQL, SQLite3, Fileinfo, etc.)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, sqlite3, gd, fileinfo
          coverage: none

      - name: Copy CI testing environment configuration
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ensure real application key
        run: php artisan key:generate --force

      - name: Run migrations from clean database on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apexstore_testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate:fresh --force

      - name: Run Complete Relevant Laravel Feature Test Suite on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apexstore_testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan test --testsuite=Feature,Unit --stop-on-failure

      - name: Publish PHP Test Artifacts and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-logs
          path: |
            storage/logs/*.log
            .test-output/
          if-no-files-found: ignore
